<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>This is my CV</title>

  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Lora&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">

  <script src="assets/js/md_HTML.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>
<body>

  <!-- buttons... -->
  <header>
    <nav class="navbar">
      <div class="nav-left">
        <a href="index.html" class="home-btn">Home</a>
      </div>
      <div class="nav-right">
        <a href="about.html">About</a>
        <a href="cv.html">CV</a>
        <a href="research.html">Research</a>
        <a href="spectrography.html">Spectrography</a>
      </div>
    </nav>
  </header>

  <!-- tutle -->
  <h1 class="page-title"> CV </h1>
  <!-- cpntent -->
 <div id="cv-content" class="page-content">
    <p>CV loading...</p>
  </div>
  
  <!-- download button for cv -->
  <button id="download-pdf">Download CV as PDF</button>

<script>
  fetch('assets/attatchments/cv/cv.md')
    .then(response => response.text())
    .then(text => {
      // render md
      document.getElementById('cv-content').innerHTML = marked.parse(text);

      // PDF download
      document.getElementById('download-pdf').addEventListener('click', () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        // Convert HTML to PDF
        doc.html(document.getElementById('cv-content'), {
          callback: function (doc) {
            doc.save('CV.pdf');
          },
          x: 10,
          y: 10,
          width: 190,
          windowWidth: document.body.scrollWidth
        });
      });
    })
    .catch(err => {
      document.getElementById('cv-content').innerHTML = '<p>FAILURE YOU ARE.</p>';
      console.error(err);
    });
</script>

</body>
</html>
